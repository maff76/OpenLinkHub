{{ define "xeneon-cooling-overview" }}
{{ $root := .Root }}
{{ $widget := .WidgetArea.Widget }}
<div class="edge-panel xeneon-extra" id="xeneon-cooling-overview" style="--widget-text: {{ $widget.TextColor }}; --widget-subtext: {{ $widget.SubTextColor }}; --widget-accent: {{ $widget.DataColor }}; --widget-font-size: {{ $widget.FontSize }}px; --widget-subfont-size: {{ $widget.SubFontSize }}px;" data-device-id="{{ $widget.DeviceId }}" data-channel-id="{{ $widget.ChannelId }}" data-source="{{ $widget.Source }}" data-history-minutes="{{ $widget.HistoryMinutes }}" data-max="{{ $widget.Max }}" data-temperature-unit="{{ $widget.Unit }}">
    <div class="card system-card">
        <div class="card-body">
            <div class="xeneon-extra-heading">{{ $widget.HeaderText }}</div>
            <div class="xeneon-cooling-list"></div>
            <div class="xeneon-extra-status" role="status">{{ $root.Lang "txtXeneonNoSensor" }}</div>
        </div>
    </div>
</div>
{{ end }}
